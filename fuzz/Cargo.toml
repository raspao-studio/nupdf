[package]
name = "nupdf-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
license = "AGPL-3.0-or-later"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
nupdf = { path = "../crates/nupdf" }

# Keep the fuzz crate out of the main workspace.
[workspace]
members = ["."]

# As in the main workspace.
[patch.crates-io]
hayro-jbig2 = { path = "../vendor/hayro-jbig2" }

[profile.release]
debug = 1

[[bin]]
name = "lex"
path = "fuzz_targets/lex.rs"
test = false
doc = false
bench = false

