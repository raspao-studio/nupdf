name: harness

# Differential runs against the pinned MuPDF oracle. Smoke tier only in CI;
# standard and wild tiers run locally (docs/TESTING.md).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - id: oracle
        run: echo "version=$(cat oracle/MUPDF_VERSION)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: target/oracle/mupdf-${{ steps.oracle.outputs.version }}/build/release/mutool
          key: mupdf-${{ runner.os }}-${{ steps.oracle.outputs.version }}
      # The runner's apt mirrors sometimes cannot be resolved for long
      # stretches: try apt briefly, then take the same qpdf version from
      # qpdf's own release.
      - name: Install qpdf
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if timeout 120 sudo apt-get install -y -o Acquire::Retries=1 qpdf; then
            exit 0
          fi
          dir="$RUNNER_TEMP/qpdf"
          mkdir -p "$dir"
          gh release download v11.9.0 --repo qpdf/qpdf --pattern 'qpdf-11.9.0-bin-linux-x86_64.zip' --dir "$dir"
          unzip -q "$dir"/qpdf-11.9.0-bin-linux-x86_64.zip -d "$dir"
          bin="$(find "$dir" -type f -name qpdf -path '*/bin/*' | head -1)"
          "$bin" --version
          echo "NUPDF_QPDF=$bin" >> "$GITHUB_ENV"
      - run: cargo xtask oracle build
      - run: cargo test --workspace -- --ignored
      - run: cargo xtask harness --tier smoke
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harness-smoke
          path: target/harness/smoke
