# The docs site: https://nupdf.dev/docs/
# Pages under src/docs, src/eval and src/SECURITY.md only include the
# repository's own files, laid out as in the repository so that their
# relative links resolve in the book too. Build: mdbook build book

[book]
title = "nupdf"
description = "A PDF engine for AI agents, in Rust: read, search, render, edit and redact PDFs"
authors = ["hum"]
language = "en"

[output.html]
git-repository-url = "https://github.com/raspao-studio/nupdf"
site-url = "/docs/"
default-theme = "light"
preferred-dark-theme = "navy"
additional-css = ["css/tokyo-night.css"]

[output.html.search]
enable = true

[output.html.playground]
runnable = false
