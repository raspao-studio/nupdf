[package]
name = "nupdf-cli"
description = "Command-line interface for nupdf, built for agents"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords = ["pdf", "cli", "mcp", "agents", "redaction"]
categories = ["command-line-utilities", "parser-implementations"]

# Where `cargo binstall nupdf-cli` finds the archives the release workflow builds.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/nupdf-{ version }-{ target }{ archive-suffix }"
bin-dir = "nupdf-{ version }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[[bin]]
name = "nupdf"
path = "src/main.rs"

[dependencies]
nupdf.workspace = true
blake3.workspace = true
clap.workspace = true
glob.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
blake3.workspace = true
serde_json.workspace = true

[lints]
workspace = true
