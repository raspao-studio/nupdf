[package]
name = "nupdf"
description = "A PDF engine for AI agents: read, search, render, edit and redact PDFs, in memory-safe Rust"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/nupdf"
readme = "../../README.md"
keywords = ["pdf", "mupdf", "parser", "render", "redaction"]
categories = ["parser-implementations", "multimedia::images", "text-processing"]

[dependencies]
aes = "0.9"
blake3.workspace = true
brotli-decompressor = "6"
# zlib-rs: a pure-Rust port of zlib, so corrupt-stream behavior matches MuPDF's zlib.
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
# Dependencies of the JBIG2 decoder carried in src/hayro_jbig2.
fearless_simd = "1.0.0"
hayro-ccitt = { version = "0.5.0", default-features = false }
moxcms = { version = "0.9", default-features = false, features = ["lut"] }
hayro-jpeg2000 = { version = "0.5", default-features = false, features = ["simd"] }
md-5 = "0.11"
memchr = "2"
sha1 = "0.11"
sha2 = "0.11"

[lints]
workspace = true
